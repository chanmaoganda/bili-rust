[workspace]
resolver = "2"
members = ["src-tauri", "ui"]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Optimise dependencies in dev so iteration on this crate isn't dragged down by
# tokio/leptos/tauri compiling at -O0. Our own crates stay at the dev default
# so panics keep their full backtrace.
[profile.dev.package."*"]
opt-level = 1
