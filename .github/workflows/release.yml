name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            bundles: deb,rpm
          - os: windows-latest
            label: windows-x86_64
            bundles: msi,nsis
          - os: macos-latest
            label: macos-aarch64
            bundles: app,dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Install tauri-cli
        run: cargo install tauri-cli@^2 --locked

      - name: Build bundles
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle_root="target/release/bundle"
          find "$bundle_root" -type f \
            \( -name '*.deb' -o -name '*.rpm' \
               -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp -f {} dist/ \;
          if [ -d "$bundle_root/macos" ]; then
            while IFS= read -r -d '' app; do
              tar -C "$(dirname "$app")" -czf "dist/$(basename "$app").tar.gz" "$(basename "$app")"
            done < <(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print0)
          fi
          ls -lh dist/
          [ -n "$(ls -A dist/)" ] || { echo "::error::dist/ is empty"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bili-rust-${{ matrix.label }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
